[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "petit-log"
version = "3.0.0"
description = "Log analysis for systems administrators — detects the log format, then collapses the repetitive into counts so the unusual is what you read"
readme = { file = "README", content-type = "text/plain" }
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
authors = [{ name = "Scott McCarty", email = "scott.mccarty@gmail.com" }]
keywords = ["log", "analysis", "syslog", "apache", "sysadmin", "deduplication"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Logging",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/crunchtools/petit"
Source = "https://github.com/crunchtools/petit"
Changelog = "https://github.com/crunchtools/petit/blob/master/CHANGELOG"

[project.scripts]
petit = "petit.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/petit"]

[tool.hatch.build.targets.sdist]
include = ["src/petit", "README", "COPYING", "CHANGELOG", "AUTHORS", "test"]

[tool.pytest.ini_options]
testpaths = ["test"]
